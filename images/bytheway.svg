<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Bytheway">
  <defs>
    <linearGradient id="bwAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <pattern id="bwGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#bwGrid)"/>

  <!-- two routes from the same start to the same end -->
  <g transform="translate(200 470)">
    <path d="M0 0 C 260 -230, 700 -230, 960 0"
          fill="none" stroke="url(#bwAccent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 0 C 300 190, 660 190, 960 0"
          fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="10 10"/>
    <circle cx="0" cy="0" r="16" fill="#0d0d0d" stroke="url(#bwAccent)" stroke-width="3"/>
    <circle cx="960" cy="0" r="16" fill="url(#bwAccent)"/>
    <g fill="#c2e9fb" opacity="0.85">
      <circle cx="292" cy="-138" r="7"/>
      <circle cx="480" cy="-166" r="7"/>
      <circle cx="668" cy="-138" r="7"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#7d7d7d">
      <text x="0" y="52" text-anchor="middle">start</text>
      <text x="960" y="52" text-anchor="middle">there</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="200" y="250" font-size="62" font-weight="600" letter-spacing="-1">ByTheWay</text>
    <text x="202" y="290" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">CO-FOUNDER &amp; CO-CTO · 2024 — 2025</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="200" y="820">carpooling · a two-sided marketplace</text>
  </g>
  <path d="M200 780 L1400 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
