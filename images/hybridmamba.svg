<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="HybridMamba-11 architecture">
  <defs>
    <linearGradient id="hmAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <pattern id="hmGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#hmGrid)"/>

  <!-- U-Net skip connections -->
  <g fill="none" stroke="#a1c4fd" stroke-opacity="0.35" stroke-width="2">
    <path d="M235 430 C 235 250, 1365 250, 1365 430"/>
    <path d="M370 430 C 370 290, 1230 290, 1230 430"/>
    <path d="M505 430 C 505 330, 1095 330, 1095 430"/>
    <path d="M640 430 C 640 370, 960 370, 960 430"/>
  </g>

  <!-- alternating Mamba / Transformer blocks -->
  <g>
    <g fill="url(#hmAccent)" opacity="0.85">
      <rect x="200" y="430" width="70" height="140" rx="6"/>
      <rect x="470" y="430" width="70" height="140" rx="6"/>
      <rect x="740" y="430" width="70" height="140" rx="6"/>
      <rect x="1010" y="430" width="70" height="140" rx="6"/>
      <rect x="1280" y="430" width="70" height="140" rx="6"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2">
      <rect x="335" y="430" width="70" height="140" rx="6"/>
      <rect x="605" y="430" width="70" height="140" rx="6"/>
      <rect x="875" y="430" width="70" height="140" rx="6"/>
      <rect x="1145" y="430" width="70" height="140" rx="6"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
      <path d="M270 500 L335 500"/><path d="M405 500 L470 500"/>
      <path d="M540 500 L605 500"/><path d="M675 500 L740 500"/>
      <path d="M810 500 L875 500"/><path d="M945 500 L1010 500"/>
      <path d="M1080 500 L1145 500"/><path d="M1215 500 L1280 500"/>
    </g>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#8f8f8f">
    <rect x="200" y="640" width="22" height="12" fill="url(#hmAccent)" opacity="0.85"/>
    <text x="236" y="651">Mamba SSM · Hillis–Steele parallel scan</text>
    <rect x="200" y="686" width="22" height="12" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2"/>
    <text x="236" y="697">Transformer attention</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="200" y="200" font-size="62" font-weight="600" letter-spacing="-1">HybridMamba-11</text>
    <text x="202" y="240" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">OPENAI PARAMETER GOLF · SUBMITTED APR 2026</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="200" y="820">31.8M params · 13.6 MB · first SSM entry</text>
    <text x="1400" y="820" text-anchor="end">48× speedup · Hillis–Steele scan</text>
  </g>
  <path d="M200 780 L1400 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
