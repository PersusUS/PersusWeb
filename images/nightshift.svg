<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="NightShift autonomous nightly queue">
  <defs>
    <linearGradient id="nsAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d5afe"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <pattern id="nsGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#nsGrid)"/>

  <!-- crescent moon -->
  <g transform="translate(1360 170)">
    <circle cx="0" cy="0" r="70" fill="url(#nsAccent)" opacity="0.9"/>
    <circle cx="26" cy="-14" r="62" fill="#0d0d0d"/>
  </g>

  <!-- state machine: claim -> execute -> reap -->
  <g transform="translate(180 330)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14">
      <rect x="0"   y="0" width="220" height="110" rx="10"/>
      <rect x="330" y="0" width="220" height="110" rx="10"/>
      <rect x="660" y="0" width="220" height="110" rx="10"/>
    </g>
    <g fill="#c9c9c9" font-size="20">
      <text x="46"  y="64">claim</text>
      <text x="360" y="64">execute</text>
      <text x="706" y="64">reap</text>
    </g>
    <g stroke="url(#nsAccent)" stroke-width="2" fill="none">
      <path d="M220 55 L330 55"/><path d="M318 46 L332 55 L318 64"/>
      <path d="M550 55 L660 55"/><path d="M648 46 L662 55 L648 64"/>
    </g>
    <text x="0" y="150" font-size="14" fill="#7d7d7d">the model never decides the state &#183; a round ends when current.json disappears</text>
  </g>

  <!-- queue: 27 shipped, 2 failed -->
  <g transform="translate(180 560)">
    <g fill="url(#nsAccent)">
      <rect x="0"   y="0" width="34" height="34" rx="4"/><rect x="44"  y="0" width="34" height="34" rx="4"/>
      <rect x="88"  y="0" width="34" height="34" rx="4"/><rect x="132" y="0" width="34" height="34" rx="4"/>
      <rect x="176" y="0" width="34" height="34" rx="4"/><rect x="220" y="0" width="34" height="34" rx="4"/>
      <rect x="264" y="0" width="34" height="34" rx="4"/><rect x="308" y="0" width="34" height="34" rx="4"/>
      <rect x="352" y="0" width="34" height="34" rx="4"/><rect x="396" y="0" width="34" height="34" rx="4"/>
      <rect x="440" y="0" width="34" height="34" rx="4"/><rect x="484" y="0" width="34" height="34" rx="4"/>
      <rect x="528" y="0" width="34" height="34" rx="4"/><rect x="0"   y="44" width="34" height="34" rx="4"/>
      <rect x="44"  y="44" width="34" height="34" rx="4"/><rect x="88"  y="44" width="34" height="34" rx="4"/>
      <rect x="132" y="44" width="34" height="34" rx="4"/><rect x="176" y="44" width="34" height="34" rx="4"/>
      <rect x="220" y="44" width="34" height="34" rx="4"/><rect x="264" y="44" width="34" height="34" rx="4"/>
      <rect x="308" y="44" width="34" height="34" rx="4"/><rect x="352" y="44" width="34" height="34" rx="4"/>
      <rect x="396" y="44" width="34" height="34" rx="4"/><rect x="440" y="44" width="34" height="34" rx="4"/>
      <rect x="484" y="44" width="34" height="34" rx="4"/><rect x="528" y="44" width="34" height="34" rx="4"/>
      <rect x="0"   y="88" width="34" height="34" rx="4"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.18">
      <rect x="44" y="88" width="34" height="34" rx="4"/><rect x="88" y="88" width="34" height="34" rx="4"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#7d7d7d">
      <text x="150" y="112">27 shipped</text>
      <text x="150" y="132" fill="#5a5a5a">2 failed</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="180" y="200" font-size="62" font-weight="600" letter-spacing="-1">NightShift</text>
    <text x="182" y="240" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">A QUEUE THAT WORKS WHILE I SLEEP</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="150" y="820">real state machine &#183; unattended coding agent</text>
    <text x="1450" y="820" text-anchor="end">report in telegram by morning</text>
  </g>
  <path d="M150 780 L1450 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
