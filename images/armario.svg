<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Armario outfit engine">
  <defs>
    <linearGradient id="arAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a202"/>
      <stop offset="100%" stop-color="#e8491f"/>
    </linearGradient>
    <pattern id="arGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#arGrid)"/>

  <!-- weather strip feeding the engine -->
  <g transform="translate(150 330)">
    <rect x="0" y="-46" width="300" height="92" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="52" cy="0" r="18" fill="url(#arAccent)" opacity="0.85"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#c9c9c9">
      <text x="92" y="-6" font-size="20">SEVILLA</text>
      <text x="92" y="22" font-size="18" fill="#7d7d7d">21.7 – 39.5 °C</text>
    </g>
    <path d="M320 0 L390 0" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M378 -9 L392 0 L378 9" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- outfit slots -->
  <g transform="translate(700 250)">
    <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12">
      <rect x="0"   y="0" width="130" height="180" rx="10"/>
      <rect x="152" y="0" width="130" height="180" rx="10"/>
      <rect x="304" y="0" width="130" height="180" rx="10"/>
      <rect x="456" y="0" width="130" height="180" rx="10"/>
      <rect x="608" y="0" width="130" height="180" rx="10"/>
    </g>
    <g fill="url(#arAccent)" opacity="0.75">
      <rect x="26"  y="34"  width="78" height="112" rx="8"/>
      <rect x="178" y="46"  width="78" height="100" rx="8" opacity="0.8"/>
      <rect x="330" y="58"  width="78" height="88"  rx="8" opacity="0.65"/>
      <rect x="482" y="86"  width="78" height="60"  rx="8" opacity="0.5"/>
      <rect x="634" y="98"  width="78" height="48"  rx="8" opacity="0.35"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#7d7d7d" letter-spacing="1">
      <text x="0"   y="212">OUTER</text>
      <text x="152" y="212">TOP</text>
      <text x="304" y="212">BOTTOM</text>
      <text x="456" y="212">SHOES</text>
      <text x="608" y="212">EXTRAS</text>
    </g>
  </g>

  <!-- the weights, scored not prompted -->
  <g transform="translate(150 620)">
    <g fill="#ffffff" fill-opacity="0.14">
      <rect x="0" y="0"   width="620" height="10" rx="5"/>
      <rect x="0" y="30"  width="620" height="10" rx="5"/>
      <rect x="0" y="60"  width="620" height="10" rx="5"/>
      <rect x="0" y="90"  width="620" height="10" rx="5"/>
    </g>
    <g fill="url(#arAccent)">
      <rect x="0" y="0"   width="540" height="10" rx="5"/>
      <rect x="0" y="30"  width="380" height="10" rx="5"/>
      <rect x="0" y="60"  width="290" height="10" rx="5"/>
      <rect x="0" y="90"  width="170" height="10" rx="5"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#7d7d7d">
      <text x="650" y="10">weather fit ×3.0</text>
      <text x="650" y="40">occasion ×2.0</text>
      <text x="650" y="70">fits me / I like it ×1.5</text>
      <text x="650" y="100">worn recently ×0.3</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="150" y="200" font-size="62" font-weight="600" letter-spacing="-1">Armario</text>
    <text x="152" y="240" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">A WARDROBE THAT READS THE FORECAST</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="150" y="820">rules, not prompts · every suggestion says why</text>
    <text x="1450" y="820" text-anchor="end">runs on the tablet, offline</text>
  </g>
  <path d="M150 780 L1450 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
