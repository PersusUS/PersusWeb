<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="ClassTranscriber audio pipeline">
  <defs>
    <linearGradient id="ctAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <pattern id="ctGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#ctGrid)"/>

  <!-- waveform resolving into text lines -->
  <g transform="translate(150 430)">
    <g fill="url(#ctAccent)">
      <rect x="0"   y="-70" width="7" height="140" rx="3" opacity="0.9"/>
      <rect x="18"  y="-40" width="7" height="80"  rx="3" opacity="0.8"/>
      <rect x="36"  y="-95" width="7" height="190" rx="3" opacity="0.95"/>
      <rect x="54"  y="-55" width="7" height="110" rx="3" opacity="0.75"/>
      <rect x="72"  y="-25" width="7" height="50"  rx="3" opacity="0.6"/>
      <rect x="90"  y="-80" width="7" height="160" rx="3" opacity="0.85"/>
      <rect x="108" y="-110" width="7" height="220" rx="3" opacity="1"/>
      <rect x="126" y="-45" width="7" height="90"  rx="3" opacity="0.7"/>
      <rect x="144" y="-65" width="7" height="130" rx="3" opacity="0.8"/>
      <rect x="162" y="-30" width="7" height="60"  rx="3" opacity="0.55"/>
      <rect x="180" y="-88" width="7" height="176" rx="3" opacity="0.9"/>
      <rect x="198" y="-50" width="7" height="100" rx="3" opacity="0.7"/>
      <rect x="216" y="-20" width="7" height="40"  rx="3" opacity="0.45"/>
      <rect x="234" y="-72" width="7" height="144" rx="3" opacity="0.8"/>
      <rect x="252" y="-38" width="7" height="76"  rx="3" opacity="0.6"/>
    </g>
    <path d="M300 0 L370 0" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M358 -9 L372 0 L358 9" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="404" y="-78" width="330" height="12" rx="6"/>
      <rect x="404" y="-46" width="420" height="12" rx="6"/>
      <rect x="404" y="-14" width="270" height="12" rx="6"/>
      <rect x="404" y="18"  width="390" height="12" rx="6"/>
      <rect x="404" y="50"  width="200" height="12" rx="6"/>
    </g>
    <g fill="url(#ctAccent)" opacity="0.55">
      <rect x="404" y="-78" width="86" height="12" rx="6"/>
      <rect x="404" y="18"  width="120" height="12" rx="6"/>
    </g>
  </g>

  <!-- seven stages -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#7d7d7d">
    <text x="150" y="700">sounddevice → noisereduce → pyannote → faster-whisper large-v3 → gemma3:4b</text>
  </g>
  <g>
    <path d="M150 640 L1450 640" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <g fill="url(#ctAccent)">
      <circle cx="150" cy="640" r="6"/><circle cx="367" cy="640" r="6"/>
      <circle cx="584" cy="640" r="6"/><circle cx="800" cy="640" r="6"/>
      <circle cx="1017" cy="640" r="6"/><circle cx="1234" cy="640" r="6"/>
      <circle cx="1450" cy="640" r="6"/>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="150" y="200" font-size="62" font-weight="600" letter-spacing="-1">ClassTranscriber</text>
    <text x="152" y="240" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">A SEVEN-STAGE LECTURE PIPELINE, ALL LOCAL</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="150" y="820">record · denoise · diarise · transcribe · clean up</text>
    <text x="1450" y="820" text-anchor="end">nothing leaves the machine</text>
  </g>
  <path d="M150 780 L1450 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
