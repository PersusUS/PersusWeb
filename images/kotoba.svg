<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Kotoba spaced-repetition Japanese">
  <defs>
    <linearGradient id="koAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5473d"/>
      <stop offset="100%" stop-color="#b81d24"/>
    </linearGradient>
    <pattern id="koGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#koGrid)"/>

  <!-- torii -->
  <g transform="translate(180 300)" fill="url(#koAccent)">
    <rect x="-20" y="0" width="360" height="26" rx="4"/>
    <rect x="10" y="52" width="300" height="16" rx="3" opacity="0.9"/>
    <rect x="34" y="26" width="30" height="200"/>
    <rect x="256" y="26" width="30" height="200"/>
    <rect x="120" y="68" width="14" height="60" opacity="0.7"/>
  </g>

  <!-- an item is two cards, one per direction, each with its own state -->
  <g transform="translate(640 250)">
    <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12">
      <rect x="0" y="0" width="200" height="130" rx="10"/>
      <rect x="240" y="0" width="200" height="130" rx="10"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#c9c9c9">
      <text x="24" y="54" font-size="26">&#39135;&#12409;&#12427;</text>
      <text x="24" y="90" font-size="16" fill="#7d7d7d">JP &#8594; ES</text>
      <text x="264" y="54" font-size="22">to eat</text>
      <text x="264" y="90" font-size="16" fill="#7d7d7d">ES &#8594; JP</text>
    </g>
    <circle cx="176" cy="24" r="7" fill="url(#koAccent)"/>
    <circle cx="416" cy="24" r="7" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- SM-2 intervals growing -->
  <g transform="translate(640 470)">
    <g fill="#ffffff" fill-opacity="0.14">
      <rect x="0" y="0"  width="720" height="10" rx="5"/>
      <rect x="0" y="30" width="720" height="10" rx="5"/>
      <rect x="0" y="60" width="720" height="10" rx="5"/>
      <rect x="0" y="90" width="720" height="10" rx="5"/>
    </g>
    <g fill="url(#koAccent)">
      <rect x="0" y="0"  width="70"  height="10" rx="5"/>
      <rect x="0" y="30" width="150" height="10" rx="5"/>
      <rect x="0" y="60" width="330" height="10" rx="5"/>
      <rect x="0" y="90" width="640" height="10" rx="5"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#7d7d7d">
      <text x="740" y="10">1 d</text>
      <text x="740" y="40">6 d</text>
      <text x="740" y="70">16 d</text>
      <text x="740" y="100">42 d</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="180" y="200" font-size="62" font-weight="600" letter-spacing="-1">Kotoba</text>
    <text x="182" y="240" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">THE ENTIRE JLPT, SPACED &#183; N5&#8211;N1</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="150" y="820">no pip, no cdn &#183; stdlib, sqlite, one page</text>
    <text x="1450" y="820" text-anchor="end">20,785 cards &#183; same python in the apk</text>
  </g>
  <path d="M150 780 L1450 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
