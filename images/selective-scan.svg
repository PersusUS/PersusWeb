<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Decoupled look-back scan across tiles">
  <defs>
    <linearGradient id="ssAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <pattern id="ssGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="ssArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1c4fd" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#ssGrid)"/>

  <!-- look-back: each tile inspects its predecessors until it finds an inclusive prefix -->
  <g fill="none" stroke="#a1c4fd" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ssArrow)">
    <path d="M1265 430 C 1265 320, 1085 320, 1085 424"/>
    <path d="M1245 430 C 1245 290, 905 290, 905 424"/>
    <path d="M1225 430 C 1225 260, 725 260, 725 424"/>
  </g>

  <!-- tiles: resolved prefix (filled) and pending aggregate (outlined) -->
  <g>
    <g fill="url(#ssAccent)" opacity="0.85">
      <rect x="200" y="430" width="130" height="140" rx="6"/>
      <rect x="380" y="430" width="130" height="140" rx="6"/>
      <rect x="560" y="430" width="130" height="140" rx="6"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2">
      <rect x="740" y="430" width="130" height="140" rx="6"/>
      <rect x="920" y="430" width="130" height="140" rx="6"/>
      <rect x="1100" y="430" width="130" height="140" rx="6"/>
      <rect x="1280" y="430" width="130" height="140" rx="6"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#0d0d0d" text-anchor="middle">
      <text x="265" y="508">P</text><text x="445" y="508">P</text><text x="625" y="508">P</text>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#8f8f8f" text-anchor="middle">
      <text x="805" y="508">A</text><text x="985" y="508">A</text><text x="1165" y="508">A</text><text x="1345" y="508">X</text>
    </g>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#8f8f8f">
    <rect x="200" y="640" width="22" height="12" fill="url(#ssAccent)" opacity="0.85"/>
    <text x="236" y="651">P · inclusive prefix published, predecessors no longer needed</text>
    <rect x="200" y="686" width="22" height="12" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2"/>
    <text x="236" y="697">A · local aggregate only, still walking backwards</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="200" y="200" font-size="62" font-weight="600" letter-spacing="-1">Selective-scan CUDA kernels</text>
    <text x="202" y="240" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">FIVE IMPLEMENTATIONS · DECOUPLED LOOK-BACK · SEP 2026</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="200" y="820">79.6–91.5% of peak bandwidth · RTX 4050 Laptop</text>
    <text x="1400" y="820" text-anchor="end">54–69× over PyTorch · 107 checks · 630 determinism runs</text>
  </g>
  <path d="M200 780 L1400 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
