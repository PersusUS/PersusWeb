<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Radiation-tolerant LLM inference on Jetson Orin Nano">
  <defs>
    <linearGradient id="jtAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <radialGradient id="jtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a1c4fd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a1c4fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="jtGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#jtGrid)"/>
  <circle cx="1080" cy="470" r="380" fill="url(#jtGlow)"/>

  <!-- cosmic ray tracks / single event upsets -->
  <g stroke="#c2e9fb" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <path d="M1420 120 L1140 400"/>
    <path d="M1500 250 L1230 520"/>
    <path d="M1330 90 L1040 380"/>
  </g>
  <g fill="#c2e9fb">
    <circle cx="1140" cy="400" r="5"/>
    <circle cx="1230" cy="520" r="5"/>
    <circle cx="1040" cy="380" r="5"/>
  </g>

  <!-- SoC die with I/O pads -->
  <g transform="translate(880 300)">
    <rect x="0" y="0" width="340" height="340" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="60" y="60" width="220" height="220" rx="8" fill="url(#jtAccent)" opacity="0.16"/>
    <rect x="60" y="60" width="220" height="220" rx="8" fill="none" stroke="url(#jtAccent)" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
      <path d="M110 0 L110 -40"/><path d="M170 0 L170 -40"/><path d="M230 0 L230 -40"/>
      <path d="M110 340 L110 380"/><path d="M170 340 L170 380"/><path d="M230 340 L230 380"/>
      <path d="M0 110 L-40 110"/><path d="M0 170 L-40 170"/><path d="M0 230 L-40 230"/>
      <path d="M340 110 L380 110"/><path d="M340 170 L380 170"/><path d="M340 230 L380 230"/>
    </g>
    <text x="170" y="178" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#c2e9fb" letter-spacing="2">ORIN</text>
    <text x="170" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#8f8f8f" letter-spacing="1">gemma 3 · 4-bit</text>
  </g>

  <!-- bit flip visual -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" letter-spacing="6">
    <text x="180" y="560" fill="#5c5c5c">0 1 1 0</text>
    <text x="318" y="560" fill="#c2e9fb">1</text>
    <text x="352" y="560" fill="#5c5c5c">0 1 0 0 1 1 0</text>
  </g>
  <text x="180" y="596" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#6f6f6f">single event upset → ECC · TMR · watchdog</text>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="180" y="290" font-size="62" font-weight="600" letter-spacing="-1">Jetson Orin · TFG</text>
    <text x="182" y="330" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">RADIATION-TOLERANT LLM INFERENCE AT THE EDGE</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="180" y="820">quantisation · fault tolerance · safety benchmark</text>
    <text x="1420" y="820" text-anchor="end">AWQ · GPTQ · TensorRT</text>
  </g>
  <path d="M180 780 L1420 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
