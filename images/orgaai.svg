<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="OrgaAI">
  <defs>
    <linearGradient id="ogAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <pattern id="ogGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#ogGrid)"/>

  <!-- scattered inputs resolving into an ordered column -->
  <g transform="translate(240 460)">
    <g fill="#5f5f5f">
      <circle cx="10" cy="-190" r="7"/><circle cx="120" cy="-120" r="7"/>
      <circle cx="-30" cy="-40" r="7"/><circle cx="140" cy="30" r="7"/>
      <circle cx="30" cy="110" r="7"/><circle cx="120" cy="200" r="7"/>
      <circle cx="-20" cy="215" r="7"/><circle cx="90" cy="-215" r="7"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
      <path d="M10 -190 L400 -150"/><path d="M120 -120 L400 -150"/>
      <path d="M90 -215 L400 -150"/>
      <path d="M-30 -40 L400 -50"/><path d="M140 30 L400 -50"/>
      <path d="M30 110 L400 50"/><path d="M120 200 L400 150"/>
      <path d="M-20 215 L400 150"/>
    </g>
    <g fill="url(#ogAccent)">
      <rect x="400" y="-166" width="300" height="32" rx="16" opacity="0.85"/>
      <rect x="400" y="-66"  width="300" height="32" rx="16" opacity="0.7"/>
      <rect x="400" y="34"   width="300" height="32" rx="16" opacity="0.55"/>
      <rect x="400" y="134"  width="300" height="32" rx="16" opacity="0.4"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#7d7d7d">
      <text x="55" y="290" text-anchor="middle">unstructured</text>
      <text x="550" y="290" text-anchor="middle">ordered</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="240" y="230" font-size="62" font-weight="600" letter-spacing="-1">OrgaAI</text>
    <text x="242" y="270" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">AI DEVELOPER</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="240" y="820">early applied AI work</text>
  </g>
  <path d="M240 780 L1400 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
