<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Agentic reasoning traces dataset">
  <defs>
    <linearGradient id="atAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
    <pattern id="atGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0d"/>
  <rect width="1600" height="900" fill="url(#atGrid)"/>

  <!-- a reasoning trace: mostly sound steps, one deliberately wrong branch -->
  <g transform="translate(230 470)">
    <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" fill="none">
      <path d="M0 0 L150 0"/><path d="M150 0 L300 0"/><path d="M300 0 L450 0"/>
      <path d="M450 0 L600 0"/><path d="M600 0 L750 0"/><path d="M750 0 L900 0"/>
      <path d="M1050 0 L1160 0"/>
    </g>
    <!-- the faulty step and its correction -->
    <path d="M900 0 C 960 0, 980 -90, 1040 -90" fill="none" stroke="#c2e9fb" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M1040 -90 C 1100 -90, 1000 0, 1050 0" fill="none" stroke="#c2e9fb" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="7 6"/>

    <g fill="url(#atAccent)">
      <circle cx="0" cy="0" r="15"/><circle cx="150" cy="0" r="15"/>
      <circle cx="300" cy="0" r="15"/><circle cx="450" cy="0" r="15"/>
      <circle cx="600" cy="0" r="15"/><circle cx="750" cy="0" r="15"/>
      <circle cx="900" cy="0" r="15"/><circle cx="1050" cy="0" r="15"/>
      <circle cx="1160" cy="0" r="15"/>
    </g>
    <circle cx="1040" cy="-90" r="17" fill="#0d0d0d" stroke="#c2e9fb" stroke-width="2.5"/>
    <path d="M1033 -97 L1047 -83 M1047 -97 L1033 -83" stroke="#c2e9fb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1040" y="-126" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#8f8f8f">seeded error</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#6f6f6f" text-anchor="middle">
      <text x="0" y="46">plan</text>
      <text x="300" y="46">retrieve</text>
      <text x="600" y="46">verify</text>
      <text x="900" y="46">revise</text>
      <text x="1160" y="46">answer</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#f4f4f4">
    <text x="150" y="220" font-size="62" font-weight="600" letter-spacing="-1">Agentic Reasoning Traces</text>
    <text x="152" y="260" font-size="22" fill="#9a9a9a" letter-spacing="2" font-family="ui-monospace, Menlo, Consolas, monospace">A DATASET FOR AUDITING HOW AGENTS THINK</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#6f6f6f" letter-spacing="1">
    <text x="150" y="820">15 traces · 142 steps · 9-type taxonomy</text>
    <text x="1450" y="820" text-anchor="end">3 traces carry deliberate errors</text>
  </g>
  <path d="M150 780 L1450 780" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
